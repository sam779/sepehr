name = "sepehr-portal"
main = "../../apps/portal-worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain — added manually in CF dashboard (Workers & Pages → sepehr-portal → Settings → Triggers → Custom Domains)
# routes = [{ pattern = "portal-api.blackoutobservatory.org", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "sepehr-portal"
database_id = "0207372d-6dd0-43a8-8eaa-4e8ad8471239"

# Required secrets — set via: wrangler secret put <KEY>
# ENCRYPTION_KEY  — base64url(32 random bytes), used for AES-256-GCM of CF API tokens
# RESEND_API_KEY  — Resend API key for transactional email
# SESSION_SECRET  — unused currently; reserved for future HMAC use

[vars]
PORTAL_URL = "https://portal-api.blackoutobservatory.org"
